            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                NoAuthenticationExample:
                  value:
                    detail: Authentication credentials were not provided.
                  summary: No authentication example
                  description: No authentication example
                InvalidTokenExample:
                  value:
                    detail: Invalid token
                  summary: Invalid token example
                  description: Invalid token example
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                NotFoundExample:
                  value:
                    detail: Not found.
                  summary: Not found example
                  description: Not found example
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                InternalServerErrorExample:
                  value:
                    detail: Internal server error.
                  summary: Internal server error
                  description: Internal server error
          description: Internal server error
    delete:
