          - boardgame
          - book
          - comic
          - game
          - manga
          - movie
          - tv
        description: Type of media item.
        required: true
      - in: path
        name: source
        schema:
          type: string
          enum:
          - bgg
          - comicvine
          - hardcover
          - igdb
          - mal
          - mangaupdates
          - manual
          - openlibrary
          - tmdb
        description: Source of the media item data.
        required: true
