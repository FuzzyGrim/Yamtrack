          - anime
          - boardgame
          - book
          - comic
          - episode
          - game
          - manga
          - movie
          - season
          - tv
        description: Type of media item.
        required: true
      tags:
      - changes_history
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: History record deleted successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                InvalidRequestExample:
                  value:
