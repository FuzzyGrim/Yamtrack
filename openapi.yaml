paths:
  /api/v1/calendar/:
    get:
      operationId: calendar_get
      description: Retrieve calendar events.
      summary: Get events
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: Filter range end date. If omitted with start_date, defaults to
          the end of that month; otherwise defaults to the end of the selected/current
          month.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          default: 20
        description: 'Maximum number of results to return (default: 20).'
      - in: query
        name: month
        schema:
          type: integer
        description: Calendar month (1-12) used with year. Used only if start_date
          is not set. Default is current month.
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        description: 'Number of results to skip before returning items (default: 0).'
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Filter range start date.
      - in: query
        name: year
        schema:
          type: integer
        description: Calendar year used with month. Used only if start_date is not
          set. Default is current year.
      tags:
      - calendar
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvents'
              examples:
                Events:
                  value:
                    pagination:
                      total: 1
                      limit: 20
                      offset: 0
                      next: null
                      previous: null
                    results:
                    - id: 5086
                      item:
                        media_id: '208569'
                        source: tmdb
                        media_type: episode
                        title: Will Trent
                        image: https://image.tmdb.org/t/p/w500/qG5O46gUxxYGImld03tl2zLhvrg.jpg
                        season_number: 4
                        episode_number: 13
                      item_id: tv/tmdb/208569/4/13
                      parent_id: tv/tmdb/208569/4
                      content_number: 13
                      datetime: '2026-04-01T00:00:00Z'
                      notification_sent: false
                  summary: Events
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                InvalidRequestExample:
                  value:
                    detail: Invalid request.
                  summary: Invalid request example
                  description: Invalid request example
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                NoAuthenticationExample:
                  value:
                    detail: Authentication credentials were not provided.
                  summary: No authentication example
                  description: No authentication example
                InvalidTokenExample:
                  value:
                    detail: Invalid token
                  summary: Invalid token example
                  description: Invalid token example
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                InternalServerErrorExample:
                  value:
                    detail: Internal server error.
                  summary: Internal server error
                  description: Internal server error
          description: Internal server error
