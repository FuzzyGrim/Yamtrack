              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                HealthyAPI:
                  value:
                    status: ok
                    timestamp: '2026-04-28T08:49:33.826808Z'
                    checks:
                      Cache(alias='default'):
                        status: ok
                        error: null
                      Database(alias='default'):
                        status: ok
                        error: null
                      Storage(alias='default'):
                        status: ok
                        error: null
                  summary: Healthy API
          description: API is healthy
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: One or more health checks failed
