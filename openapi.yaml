      type: object
      description: |-
        Serializer for tracking a new media item.

        Unified payload for creating media items. Use `source: manual` for manual items
        (omit `media_id`) or set a provider `source` and `media_id` to create from a
        provider. When using a media provider, all media data will be overwritten.
      properties:
        source:
          allOf:
          - $ref: '#/components/schemas/SourceCompleteEnum'
          nullable: true
        media_id:
          type: string
          nullable: true
          minLength: 1
        title:
          type: string
          nullable: true
          minLength: 1
        image:
          type: string
          format: uri
          nullable: true
          minLength: 1
        score:
          type: number
          format: double
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/MediaStatusEnum'
          nullable: true
        progress:
          type: integer
          nullable: true
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
          minLength: 1
        season_number:
          type: integer
          nullable: true
        episode_number:
          type: integer
          nullable: true
        parent_tv:
          type: integer
          nullable: true
          description: '`consumption_id` of the manual TV show the season belongs
            to, required for manual seasons.'
        parent_season:
          type: integer
          nullable: true
          description: '`consumption_id` of the manual season the episode belongs
            to, required for manual episodes.'
