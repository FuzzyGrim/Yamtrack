          type: string
        description: Search query to filter list items by title.
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - added
          - added_asc
          - added_desc
          - end_date
          - end_date_asc
          - end_date_desc
          - episode_number
          - episode_number_asc
          - episode_number_desc
          - id
          - id_asc
          - id_desc
          - itemid
          - itemid_asc
          - itemid_desc
          - media_id
