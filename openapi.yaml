          - season_number_desc
          - source
          - source_asc
          - source_desc
          - start_date
          - start_date_asc
          - start_date_desc
          - title
          - title_asc
          - title_desc
          - updated
          - updated_asc
          - updated_desc
        description: 'Sort field, optionally followed by `_asc` or `_desc` (default:
          ascending). Episodes only support a subset of the sorts: added, end_date,
          episode_number, id, itemid, season_number, title.'
