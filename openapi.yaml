components:
  schemas:
    ApiErrorResponse:
      type: object
      description: Standard API error response serializer.
      properties:
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation errors, keyed by field name.
        debug:
          type: string
          description: Exception message, only returned when DEBUG is enabled.
      required:
      - detail
    ApiMessageResponse:
      type: object
      description: Standard API message response serializer.
      properties:
        detail:
          type: string
      required:
      - detail
    CastMember:
      type: object
      description: Serializer for a single cast member.
      properties:
        person_id:
          type: integer
        name:
          type: string
        character:
          type: string
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        order:
          type: integer
          nullable: true
        episode_count:
          type: integer
          nullable: true
      required:
      - character
      - episode_count
      - image
      - name
      - order
      - person_id
    ChangesHistoryChange:
      type: object
      description: Serializer for a single change in a history entry.
      properties:
        field:
          $ref: '#/components/schemas/FieldEnum'
        old_value:
          nullable: true
        new_value:
          nullable: true
      required:
      - field
    ChangesHistoryEntry:
      type: object
      description: Serializer that builds a change-based history entry.
      properties:
        id:
          type: integer
          nullable: true
        item_id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangesHistoryChange'
          readOnly: true
      required:
      - changes
    Company:
      type: object
      description: Serializer for a company involved in a media.
      properties:
        company_id:
          type: integer
        name:
          type: string
        logo:
          type: string
          format: uri
          nullable: true
        roles:
          type: array
          items:
            type: string
      required:
      - company_id
      - logo
