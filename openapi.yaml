        name: history_id
        schema:
          type: string
        description: The ID of the changes history record to retrieve.
        required: true
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - episode
          - game
          - manga
          - movie
          - season
          - tv
        description: Type of media item.
