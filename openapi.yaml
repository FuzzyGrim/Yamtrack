  /api/v1/changes_history/{media_type}/{history_id}/:
    get:
      operationId: changes_history_entry_get
      description: Retrieve the changes history record for a specific media.
      summary: Get changes history record
      parameters:
      - in: path
        name: history_id
        schema:
          type: string
        description: The ID of the changes history record to retrieve.
        required: true
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - episode
          - game
          - manga
          - movie
          - season
          - tv
        description: Type of media item.
        required: true
      tags:
      - changes_history
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesHistoryEntry'
              examples:
                ChangesHistoryRecord:
                  value:
                    id: 312
                    item_id: tv/tmdb/245703
                    timestamp: '2026-01-18T15:21:02.920479Z'
                    changes:
                    - field: status
                      old_value: 3
                      new_value: 1
                  summary: Changes history record
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
