name: Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - "dev"
    tags:
      - "v*"
  pull_request:
    branches:
      - "dev"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      # Single platform, loaded locally so the image can actually be run
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: yamtrack:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          platforms: linux/amd64
          build-args: |
            VERSION=test

      - name: Start container
        run: |
          docker network create yamtrack-test
          docker run -d --name yamtrack-redis --network yamtrack-test redis:8-alpine
          docker run -d --name yamtrack --network yamtrack-test \
            -e TZ=UTC \
            -e SECRET=github-actions-testing-secret \
            -e REDIS_URL=redis://yamtrack-redis:6379 \
            -p 8000:8000 \
            yamtrack:test

      # The image HEALTHCHECK covers database, cache, redis and celery
      - name: Wait for container to become healthy
        run: |
          for _ in $(seq 1 60); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' yamtrack)
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' yamtrack)" != "true" ]; then
              echo "::error::Container exited before becoming healthy"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Container did not become healthy in time"
          exit 1

      - name: Check health endpoint
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/

      - name: Check login page is served
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/accounts/login/ \
            | grep -q "Yamtrack"

      - name: Check static files are served
        run: |
          curl --fail --silent --show-error --output /dev/null \
            http://127.0.0.1:8000/static/css/main.css

      - name: Check version was baked into the image
        run: |
          test "$(docker exec yamtrack printenv VERSION)" = "test"

      - name: Dump container logs
        if: failure()
        run: |
          docker logs yamtrack
          docker logs yamtrack-redis

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # This ensures all tags are fetched for git describe

      - name: Get version from git
        id: get-version
        run: |
          VERSION=$(git describe --tags 2>/dev/null || echo "dev")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Extract Docker metadata tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Determine if we should push the image
      - name: Set push flag
        id: push-flag
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "PUSH=true" >> $GITHUB_OUTPUT
          else
            echo "PUSH=false" >> $GITHUB_OUTPUT
          fi

      # Only log in if we're going to push
      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.push-flag.outputs.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.push-flag.outputs.PUSH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.get-version.outputs.VERSION }}
