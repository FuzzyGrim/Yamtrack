{% extends "base.html" %}
{% load static %}

{% block title %}
  Profile - Yamtrack
{% endblock title %}

{% block content %}
  <div class="mx-auto max-w-6xl">
    <div class="bg-[#2a2f35] rounded-lg p-6">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg"
               width="24"
               height="24"
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round"
               class="w-6 h-6 text-indigo-400 mr-3">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <h2 class="text-xl font-semibold">{{ user.username }}</h2>
        </div>
        <div class="text-right">
          <p class="text-gray-400 text-sm">Member Since</p>
          <p class="text-white">{{ user.date_joined|date:"F j, Y" }}</p>
        </div>
      </div>

      <div class="border-t border-gray-600"></div>
      
      {% include "users/components/hall_of_fame.html" %}
    </div>
  </div>
{% endblock content %}
