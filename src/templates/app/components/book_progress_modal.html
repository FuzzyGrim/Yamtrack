{% load app_tags %}

<style>
  .book-accent-hover {
    background: transparent;
    color: inherit;
    transition: transform 0.2s ease;
  }
  .book-accent-hover:hover {
    background: #ffffff !important;
    color: #000000 !important;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35) !important;
    transform: translateY(-1px);
  }
</style>

<!-- Modal backdrop -->
<div id="book-progress-modal-root" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" onclick="if(event.target === this) this.remove()">
    <!-- Modal content -->
    <div class="bg-[#2a2f35] rounded-lg shadow-xl overflow-hidden relative max-w-2xl w-full sm:w-auto mx-4" style="max-width: 46rem;"
         @click.stop
         data-book-progress-modal>
         
        <form id="book-progress-form"
              method="post"
              action="{% url 'log_book_progress' media.source media.media_id %}"
              hx-post="{% url 'log_book_progress' media.source media.media_id %}"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-target="#media-actions"
              hx-swap="innerHTML"
              hx-on::after-request="this.closest('.fixed')?.remove()">
            {% csrf_token %}
            <div class="p-6">
                <!-- Header -->
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">{{ media.title }}</h2>
                    <button onclick="this.closest('.fixed').remove()" 
                            class="text-gray-400 hover:text-white transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                
                <!-- Content -->
                <div class="flex gap-6">
                    <img src="{% get_user_poster_image media user %}" alt="{{ media.title }}" width="156" class="rounded flex-shrink-0" style="height: auto;">
                    <div class="flex-1 flex flex-col">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-300 mb-3">Progress Type</label>
                            <div class="flex w-48 border border-gray-600 rounded-lg overflow-hidden bg-[#1f2329] divide-x divide-gray-600" role="group">
                                <input type="radio" id="progress_type_pages" name="progress_type" value="pages" class="hidden" checked>
                                <label for="progress_type_pages"
                                       data-progress-option="pages"
                                       class="flex-1 text-center px-4 py-2 text-sm font-medium cursor-pointer transition-colors duration-150 bg-gray-600 text-white">
                                    Pages
                                </label>
                                <input type="radio" id="progress_type_percentage" name="progress_type" value="percentage" class="hidden">
                                <label for="progress_type_percentage"
                                       data-progress-option="percentage"
                                       class="flex-1 text-center px-4 py-2 text-sm font-medium cursor-pointer transition-colors duration-150 text-gray-300 hover:bg-[#343a40]">
                                    Percentage
                                </label>
                            </div>
                        </div>
                        
                        <div class="mb-6">
                            <label for="progress_value" class="block text-sm font-medium text-gray-300 mb-2">
                                Progress Value
                            </label>
                            <div class="flex items-center gap-2">
                                <input type="number" 
                                       id="progress_value" 
                                       name="progress_value" 
                                       min="0" 
                                       max="10000"
                                       class="w-32 bg-[#1f2329] text-white px-3 py-2 rounded border border-gray-600 focus:outline-none focus:border-gray-400"
                                       required>
                                <span data-progress-unit class="text-sm text-gray-300">pages</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">Enter pages read or percentage (0-100)</p>
                        </div>
                    </div>
                </div>

                <!-- Footer with actions -->
                <div class="flex flex-col gap-3 mt-6 pt-4 border-t border-gray-600">
                    <button type="button"
                            class="border border-gray-600 px-6 py-2 text-sm font-medium rounded flex items-center justify-center gap-2 book-accent-hover"
                            onclick="loadBookLogModal('{% url 'log_modal' media.source media.media_type media.media_id %}?book_complete=1')">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Mark Book Complete &amp; Log
                    </button>
                    <button type="submit" 
                            class="bg-gray-700 hover:bg-gray-600 px-8 py-2.5 text-sm font-medium text-white rounded transition-colors duration-200 ease-in-out">
                        Log Progress
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
  (function () {
    const modalRoot = document.getElementById('book-progress-modal-root');
    if (typeof initBookProgressModal === 'function' && modalRoot) {
        initBookProgressModal(modalRoot);
    }
  })();
</script>
