{% if results %}
  <div class="space-y-2 max-h-64 overflow-y-auto">
    {% for result in results %}
      <form method="post" action="{% url 'media_relink' %}">
        {% csrf_token %}
        <input type="hidden" name="instance_id" value="{{ instance_id }}">
        <input type="hidden" name="media_type" value="{{ media_type }}">
        <input type="hidden" name="new_media_id" value="{{ result.media_id }}">
        <input type="hidden" name="new_source" value="{{ result.source }}">
        <button type="submit"
                class="w-full flex items-center gap-3 p-2 rounded-md hover:bg-[#2a2f35] transition duration-200 cursor-pointer text-left">
          <img src="{{ result.image }}"
               alt="{{ result.title }}"
               class="w-10 h-14 rounded object-cover bg-[#2a2f35] flex-shrink-0">
          <span class="text-white text-sm truncate">{{ result.title }}</span>
        </button>
      </form>
    {% endfor %}
  </div>
{% else %}
  <p class="text-gray-400 text-sm">No results found.</p>
{% endif %}
