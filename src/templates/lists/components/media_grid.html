{% load app_tags %}

{% for item in items %}
  <div data-list-item
       {% if forloop.last and has_next %} hx-get="{% url 'list_detail' custom_list.id %}?page={{ next_page_number }}" hx-trigger="revealed threshold:200px" hx-swap="afterend" hx-include="#filter-form" hx-indicator="#loading-indicator" {% endif %}>
    {% include "app/components/media_card.html" with media=item.media item=item title=item from_grid=True custom_list=custom_list %}
  </div>
{% endfor %}
