{% load app_tags %}

{% comment %}
  Sections are built by localTime.js: which day a release falls on, and which
  day is today, are the viewer's questions.
{% endcomment %}
<div class="space-y-6"
     data-calendar-list
     data-month="{{ month }}"
     data-year="{{ year }}"
     data-month-name="{{ month_name }}"></div>

<template data-calendar-releases>
  {% for release in releases %}
    <a href="{{ release.item|media_url }}"
       class="block"
       data-release-instant="{{ release.datetime|utc_iso }}">
      <div class="flex items-center gap-3 p-2 rounded-md hover:bg-[#454d5a] transition-colors">
        <img alt="{{ release }}"
             class="w-10 h-10 object-cover rounded-md shrink-0"
             src="{{ release.item.image }}">
        <div class="flex-1 min-w-0">
          <h4 class="font-medium text-sm line-clamp-1">{{ release.item }}</h4>
          <div class="flex items-center">
            <span class="text-xs text-gray-400 me-2">{{ release.item.media_type|media_type_readable }}</span>
            {% if release.readable_content_number %}
              <span class="text-xs text-indigo-400">{{ release.readable_content_number }} at {{ release.datetime|time_format }}</span>
            {% endif %}
          </div>
        </div>
      </div>
    </a>
  {% endfor %}
</template>
