  /apis/listenbrainz/1/user/{username}/listens/:
    get:
      operationId: getListenBrainzUserListens
      description: Returns recorded plays newest first, so ListenBrainz clients such
        as Multi-Scrobbler can check what has already reached Floppy before submitting
        a play. Only the token owner's listens are available.
      summary: Get listens for a user (ListenBrainz-compatible)
      parameters:
      - in: query
        name: count
        schema:
          type: integer
        description: Maximum listens to return (default 25).
      - in: query
        name: max_ts
        schema:
          type: integer
        description: Exclusive upper bound on listened_at (Unix seconds).
      - in: query
        name: min_ts
        schema:
          type: integer
        description: Exclusive lower bound on listened_at (Unix seconds).
      - in: path
        name: username
        schema:
          type: string
        description: The token owner's Floppy username.
        required: true
      tags:
      - apis
      security:
      - listenBrainzToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenBrainzListens'
