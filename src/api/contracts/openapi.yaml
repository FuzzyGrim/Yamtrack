      - air_date
      - episode_code
      - episode_number
      - ids
      - image
      - is_rewatch
      - season_number
      - title
      - url
    Pagination:
      type: object
      description: Stable limit/offset response metadata.
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
      required:
      - limit
      - next
      - offset
      - previous
      - total
    ProviderGameLengths:
      type: object
      description: Full persisted game-length payload, as returned on the detail endpoint.
      properties:
        active_source:
          type: string
        state:
          $ref: '#/components/schemas/StateEnum'
        hltb:
          $ref: '#/components/schemas/HltbGameLength'
        igdb:
          $ref: '#/components/schemas/IgdbGameLength'
      required:
      - active_source
      - state
    ProviderGameLengthsSummary:
      type: object
      description: 'Search-result length summary: totals only, no per-platform tables.'
      properties:
        active_source:
          type: string
        hltb_summary:
          $ref: '#/components/schemas/HltbGameLengthSummary'
        igdb_summary:
          $ref: '#/components/schemas/IgdbGameLengthSummary'
      required:
      - active_source
    SearchEnvelope:
      type: object
      description: Search response envelope.
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
      required:
      - pagination
      - results
    SearchResult:
      type: object
      description: Fields guaranteed by every provider search result.
      properties:
        media_id:
          oneOf:
          - type: string
          - type: integer
        source:
          type: string
        media_type:
          type: string
        title:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        provider_game_lengths_summary:
          $ref: '#/components/schemas/ProviderGameLengthsSummary'
      required:
      - image
      - media_id
      - media_type
      - source
      - title
    Show:
      type: object
      description: The parent show/podcast for an episode-like tracked media entry.
      properties:
        id:
          type: integer
          nullable: true
        title:
          type: string
        slug:
          type: string
        podcast_uuid:
          type: string
          nullable: true
        image:
          type: string
        website_url:
          type: string
      required:
      - id
      - image
      - podcast_uuid
      - slug
      - title
      - website_url
    StateEnum:
      enum:
      - ready
      - pending
      - unavailable
      type: string
      description: |-
        * `ready` - ready
        * `pending` - pending
        * `unavailable` - unavailable
    TrackMediaRequest:
      type: object
      description: Accepted provider, manual-item, and tracking fields.
      properties:
        source:
          type: string
        media_id:
          oneOf:
          - type: string
          - type: integer
        title:
          type: string
        image:
          type: string
        image_url:
          type: string
          format: uri
        season_number:
          type: integer
          nullable: true
        episode_number:
          type: integer
          nullable: true
        parent_tv:
          type: integer
        parent_season:
          type: integer
        library_media_type:
          type: string
        score:
          type: number
          format: double
          nullable: true
        status:
          oneOf:
          - type: integer
          - type: string
          nullable: true
        progress:
          type: number
          format: double
          nullable: true
        start_date:
          type: string
          description: ISO 8601 date or date-time accepted by this deployment.
          nullable: true
        end_date:
          type: string
          description: ISO 8601 date or date-time accepted by this deployment.
          nullable: true
        notes:
          type: string
          nullable: true
    TrackedMediaEnvelope:
      type: object
      description: Paginated tracked-media collection.
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        results:
          type: array
          items:
            $ref: '#/components/schemas/TrackedMediaResponse'
      required:
      - pagination
      - results
    TrackedMediaResponse:
      type: object
      description: Exact MediaSerializer representation returned after tracking.
      properties:
        id:
          type: integer
          nullable: true
        consumption_id:
          type: integer
          nullable: true
        item:
          type: object
          additionalProperties: {}
          nullable: true
        item_id:
          type: string
          nullable: true
        parent_id:
          type: string
          nullable: true
        tracked:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: When this entry last changed in any way (status, score, progress,
            dates, notes, lists, tags, episodes watched). Use it with `updated_since`
            on the media list to sync only what changed.
        score:
          type: number
          format: double
          nullable: true
        scored_at:
          type: string
          format: date-time
          nullable: true
          description: When the score was last set, changed or cleared; null when
            never scored or when the rating predates this field.
        status:
          type: integer
          nullable: true
        progress:
          type: number
          format: double
          nullable: true
        episodes_left:
          type: integer
          nullable: true
        total_episodes_left:
          type: integer
          nullable: true
        progress_scope:
          type: string
          nullable: true
        progress_unit:
          type: string
          nullable: true
        progressed_at:
          type: string
          format: date-time
          nullable: true
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        lists:
          type: array
          items:
            type: object
            additionalProperties: {}
        next_episode:
          allOf:
          - $ref: '#/components/schemas/NextEpisode'
          nullable: true
        show:
          allOf:
          - $ref: '#/components/schemas/Show'
          nullable: true
      required:
      - consumption_id
      - created_at
      - end_date
      - episodes_left
      - id
      - item
      - item_id
      - lists
      - next_episode
      - notes
      - parent_id
      - progress
      - progress_scope
      - progress_unit
      - progressed_at
      - score
      - scored_at
      - show
      - source
      - start_date
      - status
      - total_episodes_left
      - tracked
      - updated_at
    TrackedMediaUpdateRequest:
      type: object
      description: Tracked-media PATCH fields, including the shared item's artwork
        URL.
      properties:
        score:
          type: number
          format: double
          nullable: true
        status:
          oneOf:
          - type: integer
          - type: string
          nullable: true
        progress:
          type: number
          format: double
          nullable: true
        start_date:
          type: string
          description: ISO 8601 date or date-time accepted by this deployment.
          nullable: true
        end_date:
          type: string
          description: ISO 8601 date or date-time accepted by this deployment.
          nullable: true
        notes:
          type: string
          nullable: true
        entry_source:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    listenBrainzToken:
      type: apiKey
      in: header
      name: Authorization
      description: ListenBrainz token in the form `Token <token>`.
