    post:
      operationId: trackMedia
      description: |-
        Create a new consumption for a media item.

        This append-oriented endpoint keeps its historical default: omitted
        status means Planning. Clients updating an existing play should first
        read its consumption_id and use the exact history route instead.

        Send an `Idempotency-Key` header to make a retry safe: repeating the
        same key and body replays the first success (header
        `Idempotent-Replayed: true` and `idempotent_replayed: true` in the body) instead of appending another play. The
        same key with a different body is refused with 422.

        `progress` set here (and returned by every media/history endpoint) is
        always this one consumption's own value, never a sum across a user's
        other entries for the same item -- the response's `progress_scope`
        field is explicitly "entry" for this reason. Its unit varies by
        media_type (e.g. minutes for games, episodes for tv/season/anime,
        plays for boardgame/music) and is named in the response's
        `progress_unit` field.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Optional. Repeating the same key and body replays the first
          success (`idempotent_replayed: true`) instead of appending another play;
          the same key with a different body returns 422 `IDEMPOTENCY_KEY_REUSED`.
          Records last 24 hours. Use after a timeout or 499, when the write may have
          committed.'
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
          - video
        description: Media type, including `season` and `episode`. POST to a media-type
          collection creates a new consumption; omitted status defaults to Planning.
          Use the history/{consumption_id} route to update one specific existing consumption.
          A `video` is created by its first play (`/videos/{source}/{media_id}/plays/`),
          not by this POST.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackMediaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrackMediaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrackMediaRequest'
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedMediaResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
      x-required-scope: watchlist:write
