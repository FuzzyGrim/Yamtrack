openapi: 3.0.3
info:
  title: Floppy verified MCP and grounding API
  version: 1.0.0
  description: |
    Verified consumer subset covering MCP HTTP operations, public grounding information, and ListenBrainz-compatible authentication.

    ## Start here

    - This document is the reviewed contract: `/api/openapi.yaml` (YAML). Browsable index: `/api/docs/`.
    - `/api/schema/` is the full, unreviewed diagnostic schema (about 200 KB). It is YAML by default; request JSON with `?format=json` or `Accept: application/json`, or YAML with `?format=yaml`. Other `format` values fall back to Accept negotiation.
    - Authenticate with `Authorization: Bearer <token>` or `X-API-Key: <token>`.

    ## Vocabulary

    - `media_type`: the kind of media (`movie`, `tv`, `game`, ...). Path segment.
    - `source`: the provider that owns `media_id` (`tmdb`, `igdb`, `manual`, ...). It is called `source` everywhere in this API, including search; there is no `provider` field on the wire.
    - `media_id`: the provider's id for the item, always a string in paths.
    - Statuses are written as an integer code (0 Planning, 1 In progress, 2 Paused, 3 Completed, 4 Dropped) or its case-insensitive label. Comic issues also accept `null` or an empty string for no status.
    - `start_date` and `end_date` take an ISO 8601 date or date-time. A date alone means midnight, and a value without an offset is read in the server's active timezone, so send an offset (`2026-03-01T20:00:00Z`) to be exact.

    ## Golden path: add a play to a game

    1. `GET /api/v1/search/{media_type}/?search=...` (optionally `&source=...`) and take `source` and `media_id` from the chosen result.
    2. `GET /api/v1/media/{media_type}/{source}/{media_id}/state/`. `tracked: false` with `consumptions: []` means the item is real but you have not tracked it. Each entry in `consumptions` has its own `consumption_id`.
    3. `POST /api/v1/media/{media_type}/` with `source` and `media_id` appends a new consumption; it never overwrites an existing one. Omitted `status` means Planning.
    4. `PATCH /api/v1/media/{media_type}/{source}/{media_id}/history/{consumption_id}/` changes exactly one consumption. Re-read `state` to verify.

    ## Detail projection

    `GET /api/v1/media/{media_type}/{source}/{media_id}/detail/` returns serializable
    title, artwork, facts, synopsis, sections and viewer tracking capabilities for
    shared web and native detail surfaces, including score/tag chips, links,
    providers, cast/crew, related/recommendation cards, seasons, paginated episodes,
    book formats, game lengths, game YouTube activity, viewer notes, recent
    history and collection details when those builders return data. It contains no
    server-rendered HTML. Anonymous callers receive public, read-only metadata;
    `?public_view=1` suppresses viewer state and actions. Returned action
    capabilities are authoritative; child watch/rating actions are limited to
    signed-in, non-public TV detail views.
    The `can_request_seerr` capability reports whether a private TMDB movie or TV
    detail has a configured Seerr connection; it does not contact Seerr or expose
    connection credentials. Clients fetch the current request state on demand.
    The companion `GET /api/v1/media/{media_type}/{source}/{media_id}/detail/gallery/`
    resolves the deferred title logo, backdrop, gallery photos and trailer.

    ## Errors

    Error bodies keep their `detail` text and HTTP status. Where recovery differs they add a stable `code`:

    | `code` | Status | Meaning |
    | --- | --- | --- |
    | `MEDIA_NOT_FOUND` | 404 | No such item (the provider does not know the id, or a manual item does not exist). Do not retry. |
    | `MEDIA_NOT_TRACKED` | 404 | The item may exist but you have not tracked it; track it first. |
    | `CONSUMPTION_NOT_FOUND` | 404 | `consumption_id` is not one of this item's entries; re-read `state`. |
    | `INVALID_STATUS` | 400 | `status` is not a code 0-4 or a known label (comic issues also allow no status). |
    | `PROVIDER_UNAVAILABLE` | 503 | The metadata provider failed; `retryable: true`. |
    | `DATABASE_BUSY` | 503 | The database was locked; retry GET requests after `Retry-After`. |

    Responses without a `code` (for example other 400 validation errors) are described by `detail` only.
  contact:
    url: https://github.com/dannyvfilms/Floppy/issues
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
paths:
  /api/v1/discover/:
    get:
      operationId: api_v1_discover_retrieve
      description: Return the cached Discover rows for the media type.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - media_type
                - show_more
                - rows
                properties:
                  media_type:
                    type: string
                  show_more:
                    type: boolean
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
          description: ''
  /api/v1/history/:
    get:
      operationId: listHistory
      description: Return the user's history grouped by day, newest first.
      parameters:
      - in: query
        name: album
        schema:
          type: integer
        description: Restrict music entries to one album id.
      - in: query
        name: artist
        schema:
          type: integer
        description: Restrict music entries to one artist's album id.
      - in: query
        name: end_date
        schema:
          type: string
        description: ISO date; restricts results to entries on/before this date.
      - in: query
        name: flat
        schema:
          type: string
        description: '`1` or `true` returns a flat, per-entry list (paginated by `limit`/`offset`
          over entries) instead of day-grouped buckets.'
      - in: query
        name: genre
        schema:
          type: string
        description: Filter by genre name.
      - in: query
        name: implied_genre
        schema:
          type: string
        description: Filter music entries by an implied (derived) genre name.
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum days (or entries, when `flat=1`); maximum 200, defaults
          to 20.
      - in: query
        name: logging_style
        schema:
          type: string
          enum:
          - repeats
          - sessions
        description: Overrides the user's saved game history logging style for this
          request.
      - in: query
        name: max_entries_per_day
        schema:
          type: integer
        description: Override the per-day entry cap (default and max 200) applied
          to day-grouped results. Ignored when `flat=1`, which paginates over individual
          entries instead of days and is never capped per day.
      - in: query
        name: media_id
        schema:
          type: string
        description: Restrict to entries for one item's media_id (requires `source`).
      - in: query
        name: media_type
        schema:
          type: array
          items:
            type: string
        description: Media type filter; repeated and comma-separated syntax are accepted.
          Alias of `types`.
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based offset over days (or entries, when `flat=1`); defaults
          to 0.
      - in: query
        name: person_id
        schema:
          type: string
        description: Restrict to entries credited to a person, by provider person
          id (requires `person_source`).
      - in: query
        name: person_source
        schema:
          type: string
        description: Restrict to entries credited to a person, by provider source
          (requires `person_id`).
      - in: query
        name: podcast_show
        schema:
          type: integer
        description: Restrict podcast entries to one show id.
      - in: query
        name: season
        schema:
          type: integer
        description: Restrict episode entries to one season id.
      - in: query
        name: season_number
        schema:
          type: integer
        description: Restrict episode entries to a season number (requires `media_id`/`source`).
      - in: query
        name: source
        schema:
          type: string
        description: Restrict to entries for one item's provider source (requires
          `media_id`).
      - in: query
        name: start_date
        schema:
          type: string
        description: ISO date; restricts results to entries on/after this date.
      - in: query
        name: tv
        schema:
          type: integer
        description: Restrict episode entries to one TV show id.
      - in: query
        name: types
        schema:
          type: array
          items:
            type: string
        description: Media type filter; repeated and comma-separated syntax are accepted.
          Alias of `media_type`.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - pagination
                - results
                properties:
                  pagination:
                    type: object
                    required:
                    - total
                    - limit
                    - offset
                    - next
                    - previous
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      next:
                        type: string
                        nullable: true
                      previous:
                        type: string
                        nullable: true
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
          description: ''
  /api/v1/home/:
    get:
      operationId: api_v1_home_retrieve
      description: Return home groups with serialized row items.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - groups
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
          description: ''
  /api/v1/imports/{service}/:
    post:
      operationId: api_v1_imports_create
      description: Dispatch the import task for the service.
      parameters:
      - in: path
        name: service
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                required:
                - task_id
                properties:
                  task_id:
                    type: string
          description: ''
  /api/v1/info/:
    get:
      operationId: getPublicInfo
      description: Get application information.
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
          description: ''
  /api/v1/lists/:
    get:
      operationId: api_v1_lists_retrieve
      description: Retrieve the lists for the authenticated user.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - pagination
                - results
                properties:
                  pagination:
                    type: object
                    required:
                    - total
                    - limit
                    - offset
                    - next
                    - previous
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      next:
                        type: string
                        nullable: true
                      previous:
                        type: string
                        nullable: true
                  results:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - description
                      - image
                      - owner
                      - collaborators
                      - viewers
                      - items_count
                      - latest_update
                      - visibility
                      - is_public
                      - is_unlisted
                      - public_slug
                      - allow_recommendations
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                        image:
                          type: string
                          nullable: true
                        owner:
                          type: object
                          additionalProperties: true
                        collaborators:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                        viewers:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                        items_count:
                          type: integer
                        latest_update:
                          type: string
                          format: date-time
                          nullable: true
                        visibility:
                          type: string
                          enum:
                          - public
                          - unlisted
                          - private
                        is_public:
                          type: boolean
                        is_unlisted:
                          type: boolean
                        public_slug:
                          type: string
                          nullable: true
                        allow_recommendations:
                          type: boolean
                        is_smart:
                          type: boolean
                        tags:
                          type: array
                          items:
                            type: string
                        include_notes:
                          type: boolean
                        completed_count:
                          type: integer
                        completion_percent:
                          type: integer
                          nullable: true
                        media_type_breakdown:
                          type: array
                          items:
                            type: object
                            properties:
                              value:
                                type: string
                              label:
                                type: string
                              count:
                                type: integer
                              percent:
                                type: integer
                              color:
                                type: string
                        items:
                          oneOf:
                          - type: array
                            items:
                              type: object
                              additionalProperties: true
                          - type: object
                            required:
                            - pagination
                            - results
                            properties:
                              pagination:
                                type: object
                                required:
                                - total
                                - limit
                                - offset
                                - next
                                - previous
                                properties:
                                  total:
                                    type: integer
                                  limit:
                                    type: integer
                                  offset:
                                    type: integer
                                  next:
                                    type: string
                                    nullable: true
                                  previous:
                                    type: string
                                    nullable: true
                              results:
                                type: array
                                items:
                                  type: object
                                  additionalProperties: true
          description: ''
    post:
      operationId: api_v1_lists_create
      description: Create a new custom list for the authenticated user.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - description
                - image
                - owner
                - collaborators
                - viewers
                - items_count
                - latest_update
                - visibility
                - is_public
                - is_unlisted
                - public_slug
                - allow_recommendations
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  image:
                    type: string
                    nullable: true
                  owner:
                    type: object
                    additionalProperties: true
                  collaborators:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  viewers:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  items_count:
                    type: integer
                  latest_update:
                    type: string
                    format: date-time
                    nullable: true
                  visibility:
                    type: string
                    enum:
                    - public
                    - unlisted
                    - private
                  is_public:
                    type: boolean
                  is_unlisted:
                    type: boolean
                  public_slug:
                    type: string
                    nullable: true
                  allow_recommendations:
                    type: boolean
                  is_smart:
                    type: boolean
                  tags:
                    type: array
                    items:
                      type: string
                  include_notes:
                    type: boolean
                  completed_count:
                    type: integer
                  completion_percent:
                    type: integer
                    nullable: true
                  media_type_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: string
                        label:
                          type: string
                        count:
                          type: integer
                        percent:
                          type: integer
                        color:
                          type: string
                  items:
                    oneOf:
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
                    - type: object
                      required:
                      - pagination
                      - results
                      properties:
                        pagination:
                          type: object
                          required:
                          - total
                          - limit
                          - offset
                          - next
                          - previous
                          properties:
                            total:
                              type: integer
                            limit:
                              type: integer
                            offset:
                              type: integer
                            next:
                              type: string
                              nullable: true
                            previous:
                              type: string
                              nullable: true
                        results:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
          description: ''
  /api/v1/lists/{list_id}/:
    patch:
      operationId: api_v1_lists_partial_update
      description: Update a specific custom list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - description
                - image
                - owner
                - collaborators
                - viewers
                - items_count
                - latest_update
                - visibility
                - is_public
                - is_unlisted
                - public_slug
                - allow_recommendations
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  image:
                    type: string
                    nullable: true
                  owner:
                    type: object
                    additionalProperties: true
                  collaborators:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  viewers:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  items_count:
                    type: integer
                  latest_update:
                    type: string
                    format: date-time
                    nullable: true
                  visibility:
                    type: string
                    enum:
                    - public
                    - unlisted
                    - private
                  is_public:
                    type: boolean
                  is_unlisted:
                    type: boolean
                  public_slug:
                    type: string
                    nullable: true
                  allow_recommendations:
                    type: boolean
                  is_smart:
                    type: boolean
                  tags:
                    type: array
                    items:
                      type: string
                  include_notes:
                    type: boolean
                  completed_count:
                    type: integer
                  completion_percent:
                    type: integer
                    nullable: true
                  media_type_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: string
                        label:
                          type: string
                        count:
                          type: integer
                        percent:
                          type: integer
                        color:
                          type: string
                  items:
                    oneOf:
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
                    - type: object
                      required:
                      - pagination
                      - results
                      properties:
                        pagination:
                          type: object
                          required:
                          - total
                          - limit
                          - offset
                          - next
                          - previous
                          properties:
                            total:
                              type: integer
                            limit:
                              type: integer
                            offset:
                              type: integer
                            next:
                              type: string
                              nullable: true
                            previous:
                              type: string
                              nullable: true
                        results:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
          description: ''
    delete:
      operationId: api_v1_lists_destroy
      description: Delete a specific custom list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/lists/{list_id}/items/:
    get:
      operationId: api_v1_lists_items_retrieve
      description: Get items of a list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedMediaEnvelope'
          description: ''
  /api/v1/media/:
    get:
      operationId: listTrackedMedia
      description: Retrieve the filtered media list for the authenticated user.
      parameters:
      - in: query
        name: author
        schema:
          type: string
      - in: query
        name: collection
        schema:
          type: string
          enum:
          - all
          - collected
          - not_collected
      - in: query
        name: completed_date_from
        schema:
          type: string
        description: Match items completed on or after this date (YYYY-MM-DD), independent
          of release year.
      - in: query
        name: completed_date_to
        schema:
          type: string
        description: Match items completed on or before this date (YYYY-MM-DD).
      - in: query
        name: completed_date_within
        schema:
          type: integer
        description: Match the last N units instead of a completed_date_from/_to range
          (1-999); see completed_date_within_unit.
      - in: query
        name: completed_date_within_unit
        schema:
          type: string
          enum:
          - days
          - months
          - weeks
          - years
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: date_added_from
        schema:
          type: string
        description: Match items added to the library on or after this date (YYYY-MM-DD).
      - in: query
        name: date_added_to
        schema:
          type: string
        description: Match items added to the library on or before this date (YYYY-MM-DD).
      - in: query
        name: date_added_within
        schema:
          type: integer
        description: Match the last N units instead of a date_added_from/_to range
          (1-999); see date_added_within_unit.
      - in: query
        name: date_added_within_unit
        schema:
          type: string
          enum:
          - days
          - months
          - weeks
          - years
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: exclude
        schema:
          type: array
          items:
            type: string
        description: Root-list type exclusions; repeated and comma-separated syntax
          are accepted.
      - in: query
        name: format
        schema:
          type: string
      - in: query
        name: genre
        schema:
          type: string
      - in: query
        name: group
        schema:
          type: string
        description: Games group key from the library groups response.
      - in: query
        name: group_by
        schema:
          type: string
          enum:
          - franchise
          - item
          - series
      - in: query
        name: implied_genre
        schema:
          type: string
        description: Music-only implied genre filter.
      - in: query
        name: initial
        schema:
          type: string
        description: 'A to Z rail: `a`-`z`, `0-9` or `other`; anything else means
          all titles.'
      - in: query
        name: language
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum 200; defaults to 20.
      - in: query
        name: media_status
        schema:
          type: string
        description: Provider metadata status, not the user's tracking status.
      - in: query
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
          - video
        description: Optional type restriction; omitted returns the default media
          types.
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based result offset; defaults to 0.
      - in: query
        name: origin
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: array
          items:
            type: string
        description: Repeat for multiple platforms; comma-separated values are also
          accepted.
      - in: query
        name: platform_mode
        schema:
          type: string
          enum:
          - and
          - not
          - or
      - in: query
        name: progress
        schema:
          type: string
          enum:
          - all
          - caught_up
          - not_caught_up
        description: Currently meaningful for TV and anime lists.
      - in: query
        name: provider
        schema:
